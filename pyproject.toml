[project]
name = "stridesense-ml"
version = "0.1.0"
description = "Training, export and evaluation for the StrideSense activity model"
requires-python = ">=3.12,<3.13"
dependencies = ["ai-edge-litert==2.3.0", "numpy>=2.0,<3", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
train = ["litert-torch==0.10.0", "matplotlib>=3.9,<4", "torch>=2.6,<2.15"]

[tool.uv]
package = false
default-groups = ["dev"]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
